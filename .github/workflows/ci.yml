name: Build and Push to ACR

on:
  push:
    branches: [ main ]

# ─── ADD THIS PERMISSIONS BLOCK HERE ────────────────────────────────
permissions:
  id-token: write  # This allows the runner to fetch a token from GitHub OIDC
  contents: read   # This allows actions/checkout to read your source code
# ─────────────────────────────────────────────────────────────────────

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Application Code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v2   # Ensure this is version 2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: "202135a5-95b6-4470-bcd4-fd4f917966f0"

    - name: Log in to Azure Container Registry
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build and Push Docker Image
      run: |
        IMAGE_TAG=${{ github.sha }}
        REGISTRY_URL=${{ secrets.ACR_NAME }}.azurecr.io
        
        docker build -t $REGISTRY_URL/gitops-app:$IMAGE_TAG .
        docker push $REGISTRY_URL/gitops-app:$IMAGE_TAG

    - name: Update GitOps Manifest Image Tag
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git clone https://${{ secrets.GITOPS_PAT }}@github.com/${{ github.repository_owner }}/azure-gitops-infra.git
        cd azure-gitops-infra/apps
        
        sed -i "s|image: .*:placeholder|image: ${{ secrets.ACR_NAME }}.azurecr.io/gitops-app:${{ github.sha }}|g" deployment.yaml
        git add deployment.yaml
        git commit -m "Automated image tag update to ${{ github.sha }} [skip ci]"
        git push origin main

       